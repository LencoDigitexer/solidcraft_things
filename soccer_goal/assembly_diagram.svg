<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0F172A"/>
        </marker>
        <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1D4ED8"/>
        </marker>
    </defs>

    <!-- Background -->
    <rect width="1200" height="820" fill="#F8FAFC"/>
    <rect x="16" y="16" width="1168" height="788" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

    <!-- Header -->
    <text x="44" y="58" font-size="26" font-weight="700" fill="#0F172A">Схема сборки футбольных ворот — РобоФинист</text>
    <text x="44" y="86" font-size="15" fill="#475569">Дисциплина «Футбол управляемых роботов»  •  Всего 41 деталь (4 типа)  •  Версии под профиль 15×15 мм и 20×20 мм</text>

    <!-- Goal line (green field hint) -->
    <line x1="150" y1="616" x2="1050" y2="268" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>

    <!-- ==================== 3 CROSSBARS (6 segments each) ==================== -->
    <!-- 1. Rear Top Crossbar (u=20..1080, v=52.5, w=152.5): (249.8, 417.0) to (907.0, 162.6) -->
    <g id="rear-top-bar">
        <line x1="249.8" y1="417.0" x2="907.0" y2="162.6" stroke="#1E40AF" stroke-width="16" stroke-linecap="butt"/>
        <line x1="249.8" y1="417.0" x2="907.0" y2="162.6" stroke="#3B82F6" stroke-width="12" stroke-linecap="butt"/>
        <!-- 5 internal pin markers + segment seams -->
        <g stroke="#0F172A" stroke-width="2">
            <line x1="356.3" y1="369.5" x2="362.3" y2="379.7"/>
            <line x1="465.8" y1="327.1" x2="471.8" y2="337.3"/>
            <line x1="575.4" y1="284.7" x2="581.4" y2="294.9"/>
            <line x1="684.9" y1="242.3" x2="690.9" y2="252.5"/>
            <line x1="794.5" y1="199.9" x2="800.5" y2="210.1"/>
        </g>
        <!-- Internal hidden pins -->
        <g stroke="#1E293B" stroke-width="6" stroke-dasharray="4,2" opacity="0.65">
            <line x1="350.0" y1="378.2" x2="368.6" y2="371.0"/>
            <line x1="459.5" y1="335.8" x2="478.1" y2="328.6"/>
            <line x1="569.1" y1="293.4" x2="587.7" y2="286.2"/>
            <line x1="678.6" y1="251.0" x2="697.2" y2="243.8"/>
            <line x1="788.2" y1="208.6" x2="806.8" y2="201.4"/>
        </g>
    </g>

    <!-- 2. Front Top Crossbar (u=20..1080, v=7.5, w=152.5): (279.0, 433.2) to (936.2, 178.8) -->
    <g id="front-top-bar">
        <line x1="279.0" y1="433.2" x2="936.2" y2="178.8" stroke="#1D4ED8" stroke-width="16" stroke-linecap="butt"/>
        <line x1="279.0" y1="433.2" x2="936.2" y2="178.8" stroke="#60A5FA" stroke-width="12" stroke-linecap="butt"/>
        <g stroke="#0F172A" stroke-width="2">
            <line x1="385.5" y1="385.7" x2="391.5" y2="395.9"/>
            <line x1="495.0" y1="343.3" x2="501.0" y2="353.5"/>
            <line x1="604.6" y1="300.9" x2="610.6" y2="311.1"/>
            <line x1="714.1" y1="258.5" x2="720.1" y2="268.7"/>
            <line x1="823.7" y1="216.1" x2="829.7" y2="226.3"/>
        </g>
        <g stroke="#1E293B" stroke-width="6" stroke-dasharray="4,2" opacity="0.65">
            <line x1="379.2" y1="394.4" x2="397.8" y2="387.2"/>
            <line x1="488.7" y1="352.0" x2="507.3" y2="344.8"/>
            <line x1="598.3" y1="309.6" x2="616.9" y2="302.4"/>
            <line x1="707.8" y1="267.2" x2="726.4" y2="260.0"/>
            <line x1="817.4" y1="224.8" x2="836.0" y2="217.6"/>
        </g>
    </g>

    <!-- 3. Rear Bottom Crossbar (u=20..1080, v=172.5, w=7.5): (171.8, 497.0) to (829.0, 242.6) -->
    <g id="rear-bot-bar">
        <line x1="171.8" y1="497.0" x2="829.0" y2="242.6" stroke="#1E3A8A" stroke-width="16" stroke-linecap="butt"/>
        <line x1="171.8" y1="497.0" x2="829.0" y2="242.6" stroke="#2563EB" stroke-width="12" stroke-linecap="butt"/>
        <g stroke="#0F172A" stroke-width="2">
            <line x1="278.3" y1="449.5" x2="284.3" y2="459.7"/>
            <line x1="387.8" y1="407.1" x2="393.8" y2="417.3"/>
            <line x1="497.4" y1="364.7" x2="503.4" y2="374.9"/>
            <line x1="606.9" y1="322.3" x2="612.9" y2="332.5"/>
            <line x1="716.5" y1="279.9" x2="722.5" y2="290.1"/>
        </g>
        <g stroke="#0F172A" stroke-width="6" stroke-dasharray="4,2" opacity="0.65">
            <line x1="272.0" y1="458.2" x2="290.6" y2="451.0"/>
            <line x1="381.5" y1="415.8" x2="400.1" y2="408.6"/>
            <line x1="491.1" y1="373.4" x2="509.7" y2="366.2"/>
            <line x1="600.6" y1="331.0" x2="619.2" y2="323.8"/>
            <line x1="710.2" y1="288.6" x2="728.8" y2="281.4"/>
        </g>
    </g>

    <!-- ==================== EXPLOSION AXES & END PINS ==================== -->
    <!-- Left explosion dashed axes -->
    <g stroke="#64748B" stroke-width="1.8" stroke-dasharray="5,4">
        <line x1="171" y1="447" x2="250" y2="417"/>
        <line x1="200" y1="463" x2="279" y2="433"/>
        <line x1="93"  y1="527" x2="172" y2="497"/>
    </g>
    <!-- Left 3 Pins -->
    <g stroke="#0F172A" stroke-width="1.5" fill="#1E293B">
        <line x1="226" y1="426" x2="248" y2="418" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
        <line x1="255" y1="442" x2="277" y2="434" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
        <line x1="148" y1="506" x2="170" y2="498" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- Right explosion dashed axes -->
    <g stroke="#64748B" stroke-width="1.8" stroke-dasharray="5,4">
        <line x1="907" y1="163" x2="982" y2="134"/>
        <line x1="936" y1="179" x2="1011" y2="150"/>
        <line x1="829" y1="243" x2="904" y2="214"/>
    </g>
    <!-- Right 3 Pins -->
    <g>
        <line x1="909" y1="162" x2="931" y2="153" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
        <line x1="938" y1="178" x2="960" y2="169" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
        <line x1="831" y1="242" x2="853" y2="233" stroke="#1E293B" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- ==================== LEFT FRAME (Exploded) ==================== -->
    <!-- Outer face + Hole via evenodd -->
    <path d="M 195.6 598.8 L 78.6 534.0 L 78.6 521.3 L 156.6 441.2 L 195.6 462.8 Z
          M 185.9 580.7 L 91.3 528.3 L 161.2 456.5 L 185.9 470.2 Z"
          fill="#2563EB" fill-rule="evenodd" stroke="#1E3A8A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 3D edge thickness highlight -->
    <polyline points="195.6,462.8 205.0,459.2 205.0,595.2 195.6,598.8" fill="none" stroke="#1D4ED8" stroke-width="4" stroke-linejoin="round"/>
    <polyline points="156.6,441.2 166.0,437.6 205.0,459.2" fill="none" stroke="#60A5FA" stroke-width="4" stroke-linejoin="round"/>
    <!-- 3 Socket markers on LeftFrame inner face -->
    <rect x="167" y="443" width="8" height="8" rx="1" fill="#0F172A"/>
    <rect x="196" y="459" width="8" height="8" rx="1" fill="#0F172A"/>
    <rect x="89"  y="523" width="8" height="8" rx="1" fill="#0F172A"/>

    <!-- ==================== RIGHT FRAME (Exploded) ==================== -->
    <path d="M 1026.4 277.2 L 909.4 212.4 L 909.4 199.7 L 987.4 119.6 L 1026.4 141.2 Z
          M 1016.7 259.1 L 922.1 206.7 L 992.0 134.9 L 1016.7 148.6 Z"
          fill="#2563EB" fill-rule="evenodd" stroke="#1E3A8A" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 3 Socket markers on RightFrame inner face -->
    <rect x="977"  y="130" width="8" height="8" rx="1" fill="#0F172A"/>
    <rect x="1006" y="146" width="8" height="8" rx="1" fill="#0F172A"/>
    <rect x="899"  y="210" width="8" height="8" rx="1" fill="#0F172A"/>

    <!-- ==================== SEGMENT LABELS & CALLOUTS ==================== -->
    <!-- Segment numbers along Front Top Crossbar -->
    <g font-size="12" font-weight="700" fill="#1E3A8A" text-anchor="middle">
        <text x="334" y="398">B1</text>
        <text x="444" y="355">B2</text>
        <text x="553" y="313">B3</text>
        <text x="663" y="271">B4</text>
        <text x="772" y="228">B5</text>
        <text x="882" y="186">B6</text>
    </g>

    <!-- LeftFrame label -->
    <line x1="120" y1="478" x2="72" y2="395" stroke="#334155" stroke-width="1.5"/>
    <circle cx="120" cy="478" r="3" fill="#334155"/>
    <rect x="34" y="346" width="168" height="48" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="46" y="367" font-size="14" font-weight="700" fill="#1E3A8A">LeftFrame (1 шт.)</text>
    <text x="46" y="385" font-size="12" fill="#475569">180 × 160 мм • 3 паза</text>

    <!-- RightFrame label -->
    <line x1="1015" y1="158" x2="1062" y2="122" stroke="#334155" stroke-width="1.5"/>
    <circle cx="1015" cy="158" r="3" fill="#334155"/>
    <rect x="986" y="72" width="174" height="48" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="998" y="93" font-size="14" font-weight="700" fill="#1E3A8A">RightFrame (1 шт.)</text>
    <text x="998" y="111" font-size="12" fill="#475569">180 × 160 мм • 3 паза</text>

    <!-- Pin callout -->
    <line x1="238" y1="422" x2="245" y2="320" stroke="#334155" stroke-width="1.5"/>
    <circle cx="238" cy="422" r="3" fill="#334155"/>
    <rect x="195" y="268" width="195" height="50" rx="8" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="207" y="290" font-size="14" font-weight="700" fill="#0F172A">Pin (шпонка, 21 шт.)</text>
    <text x="207" y="308" font-size="12" fill="#475569">по 7 шт. на каждую линию</text>

    <!-- Bar callout -->
    <line x1="578" y1="290" x2="540" y2="205" stroke="#334155" stroke-width="1.5"/>
    <circle cx="578" cy="290" r="3" fill="#334155"/>
    <rect x="425" y="154" width="232" height="50" rx="8" fill="#EFF6FF" stroke="#BFDBFE"/>
    <text x="437" y="176" font-size="14" font-weight="700" fill="#1E3A8A">Bar (сегмент балки, 18 шт.)</text>
    <text x="437" y="194" font-size="12" fill="#475569">3 перекладины × 6 сегментов</text>

    <!-- ==================== DIMENSIONS ==================== -->
    <!-- Width 1100 mm -->
    <line x1="270" y1="595" x2="952" y2="331" stroke="#0F172A" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="270" y1="570" x2="270" y2="608" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="952" y1="306" x2="952" y2="344" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="550" y="446" width="128" height="26" rx="6" fill="#FFFFFF" stroke="#CBD5E1" transform="rotate(-21.2 614 459)"/>
    <text x="614" y="464" font-size="14" font-weight="700" fill="#0F172A" text-anchor="middle" transform="rotate(-21.2 614 459)">1100 мм</text>

    <!-- Depth 180 mm -->
    <line x1="66" y1="552" x2="183" y2="617" stroke="#0F172A" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <rect x="88" y="576" width="68" height="22" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="122" y="592" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">180 мм</text>

    <!-- Height 160 mm -->
    <line x1="1048" y1="141" x2="1048" y2="277" stroke="#0F172A" stroke-width="1.8" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <line x1="1026" y1="141" x2="1058" y2="141" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="1026" y1="277" x2="1058" y2="277" stroke="#94A3B8" stroke-width="1.2"/>
    <rect x="1056" y="196" width="68" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1"/>
    <text x="1090" y="213" font-size="13" font-weight="700" fill="#0F172A" text-anchor="middle">160 мм</text>

    <!-- ==================== BOTTOM PANEL 1: ASSEMBLY STEPS ==================== -->
    <rect x="44" y="628" width="550" height="156" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="64" y="656" font-size="16" font-weight="700" fill="#0F172A">Порядок сборки</text>
    <text x="64" y="684" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#1D4ED8">Шаг 1.</tspan> Соберите 3 перекладины: по 6 балок <tspan font-weight="700">Bar</tspan> + 5 шпонок <tspan font-weight="700">Pin</tspan> внутри каждой.</text>
    <text x="64" y="710" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#1D4ED8">Шаг 2.</tspan> Вставьте 6 крайних шпонок <tspan font-weight="700">Pin</tspan> в свободные торцы перекладин.</text>
    <text x="64" y="736" font-size="13.5" fill="#334155"><tspan font-weight="700" fill="#1D4ED8">Шаг 3.</tspan> Наденьте боковины <tspan font-weight="700">LeftFrame</tspan> и <tspan font-weight="700">RightFrame</tspan> до упора.</text>
    <text x="64" y="766" font-size="12.5" fill="#64748B">Совет: для неразборной конструкции добавьте по капле суперклея в каждый паз.</text>

    <!-- ==================== BOTTOM PANEL 2: JOINT DETAIL ==================== -->
    <rect x="612" y="628" width="544" height="156" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <text x="632" y="656" font-size="16" font-weight="700" fill="#0F172A">Узел соединения (продольный разрез)</text>

    <!-- Left bar cutaway -->
    <path d="M 636 680 L 796 680 L 796 694 L 728 694 L 728 730 L 796 730 L 796 744 L 636 744 Z" fill="#3B82F6" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="728" y="694" width="68" height="36" fill="#E2E8F0"/>
    <text x="682" y="717" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bar / Frame</text>

    <!-- Center Pin -->
    <polygon points="822,698 948,698 954,704 954,720 948,726 822,726 816,720 816,704" fill="#1E293B" stroke="#0F172A" stroke-width="1.5"/>
    <text x="885" y="716" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Pin (шпонка)</text>

    <!-- Arrows into sockets -->
    <line x1="812" y1="712" x2="778" y2="712" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow-blue)"/>
    <line x1="958" y1="712" x2="992" y2="712" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow-blue)"/>

    <!-- Right bar cutaway -->
    <path d="M 974 680 L 1134 680 L 1134 744 L 974 744 L 974 730 L 1042 730 L 1042 694 L 974 694 Z" fill="#3B82F6" stroke="#1E3A8A" stroke-width="2"/>
    <rect x="974" y="694" width="68" height="36" fill="#E2E8F0"/>
    <text x="1088" y="717" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">Bar / Frame</text>

    <!-- Tolerance table under joint -->
    <text x="632" y="768" font-size="12.5" fill="#334155">
        <tspan font-weight="700">15×15 мм:</tspan> паз 8.4×10 мм, шпонка 8.0×19 мм   |   <tspan font-weight="700">20×20 мм:</tspan> паз 11.4×11 мм, шпонка 11.0×21 мм
    </text>
</svg>
